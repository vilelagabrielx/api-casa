<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Casa</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- iro.js Color Picker -->
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>
    
    <div class="container">
        <!-- Header -->
        <header class="app-header">
            <h1>Servidor 1 - Sala</h1>
            <div id="connection-status" class="status-indicator loading">
                <span class="status-dot"></span>
                <span class="status-text">Conectando à lâmpada...</span>
            </div>
        </header>

        <!-- Main Navigation (Luzes / Som) -->
        <nav class="main-nav">
            <button class="nav-tab active" data-nav="lights">💡 Luzes da Sala</button>
            <button class="nav-tab" data-nav="music">🎵 Som da Sala</button>
        </nav>

        <!-- Section 1: Lights Control -->
        <main class="control-card" id="section-lights">
            <!-- Bulb Visualization Area -->
            <div class="bulb-display">
                <div class="glow-effect" id="bulb-glow"></div>
                <svg id="bulb-svg" class="bulb-icon off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Base socket lines -->
                    <path d="M15 22h-6" />
                    <path d="M15 18H9" />
                    <path d="M13 14H11" />
                    <!-- Screw threads -->
                    <path d="M14 18v4a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-4" />
                    <!-- Glass shape -->
                    <path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7Z" />
                    <!-- Filament details -->
                    <path class="filament" d="M9 10h6" />
                    <path class="filament" d="M12 10v4" />
                </svg>
            </div>

            <!-- Main Power Switch -->
            <div class="power-control">
                <button id="power-btn" class="power-button" aria-label="Ligar/Desligar Lâmpada">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
                        <line x1="12" y1="2" x2="12" y2="12" />
                    </svg>
                </button>
                <span class="power-label" id="power-label">Desligada</span>
            </div>

            <!-- Mode Selector Tabs -->
            <div class="mode-tabs">
                <button class="tab-btn active" data-tab="color">Cores</button>
                <button class="tab-btn" data-tab="white">Luz Branca</button>
            </div>

            <!-- Control Panels -->
            <div class="panel-content">
                <!-- Color Picker Panel -->
                <div class="panel active" id="panel-color">
                    <div class="picker-wrapper">
                        <div id="picker"></div>
                    </div>
                </div>

                <!-- White Light Panel -->
                <div class="panel" id="panel-white">
                    <div class="slider-group">
                        <div class="slider-header">
                            <span>Brilho</span>
                            <span id="brightness-val">100%</span>
                        </div>
                        <div class="slider-control">
                            <input type="range" id="slider-brightness" min="10" max="1000" value="1000" class="custom-range">
                        </div>
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span>Temperatura de Cor</span>
                            <span id="temp-val">Neutro</span>
                        </div>
                        <div class="slider-control">
                            <input type="range" id="slider-temp" min="10" max="1000" value="500" class="custom-range temp-gradient">
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Section 2: Music Player -->
        <main class="control-card music-card" id="section-music" style="display: none;">
            <!-- Current Track Display -->
            <div class="track-display">
                <div class="music-icon-wrapper">
                    <svg class="music-note-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M9 18V5l12-2v13" />
                        <circle cx="6" cy="18" r="3" />
                        <circle cx="18" cy="16" r="3" />
                    </svg>
                </div>
                <div class="track-info">
                    <h2 id="track-title">Nenhuma música tocando</h2>
                    <p id="track-status">Fila vazia</p>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="playback-controls">
                <button id="prev-btn" class="control-btn" aria-label="Música Anterior">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="19 20 9 12 19 4 19 20" />
                        <line x1="5" y1="19" x2="5" y2="5" />
                    </svg>
                </button>
                <button id="play-pause-btn" class="control-btn play-btn" aria-label="Reproduzir/Pausar">
                    <!-- Play icon -->
                    <svg id="play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3" />
                    </svg>
                    <!-- Pause icon -->
                    <svg id="pause-icon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="6" y="4" width="4" height="16" />
                        <rect x="14" y="4" width="4" height="16" />
                    </svg>
                </button>
                <button id="next-btn" class="control-btn" aria-label="Próxima Música">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 4 15 12 5 20 5 4" />
                        <line x1="19" y1="5" x2="19" y2="19" />
                    </svg>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar-wrapper">
                    <input type="range" id="progress-slider" min="0" max="100" value="0" class="progress-slider">
                </div>
                <span id="total-time">0:00</span>
            </div>

            <!-- Volume Control -->
            <div class="volume-container">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="volume-icon">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
                </svg>
                <input type="range" id="volume-slider" min="0" max="100" value="80" class="custom-range volume-slider">
                <span id="volume-val">80%</span>
            </div>

            <!-- Audio Output Selector -->
            <div class="output-selector-new">
                <div class="server-toggle-container">
                    <button id="btn-toggle-server-audio" class="server-audio-btn">
                        <svg class="speaker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                            <path class="wave-path" d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
                        </svg>
                        <span>Tocar no Servidor</span>
                    </button>
                </div>
                <div id="server-device-selector-container" class="device-select-container hidden">
                    <label for="server-device-select" style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.25rem; display: block;">Dispositivo do Servidor:</label>
                    <select id="server-device-select" class="device-select">
                        <option value="">Carregando dispositivos...</option>
                    </select>
                </div>
            </div>

            <!-- Invisible HTML5 Audio element for local browser streaming -->
            <audio id="browser-audio-player" style="display: none;"></audio>

            <hr class="divider">

            <!-- Add Track Form -->
            <div class="add-track-form">
                <h3>Adicionar do YouTube</h3>
                <div class="input-group">
                    <input type="text" id="yt-url-input" placeholder="Cole o link do vídeo ou playlist...">
                    <button id="add-track-btn">Adicionar</button>
                </div>
            </div>

            <!-- Playlist Queue -->
            <div class="queue-container">
                <div class="queue-header">
                    <h3>Fila de Reprodução</h3>
                    <button id="clear-queue-btn" class="text-btn">Limpar Tudo</button>
                </div>
                <ul class="queue-list" id="queue-list">
                    <!-- Items will be generated dynamically -->
                </ul>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="app-footer">
            <p>Servidor local no Termux &bull; Lâmpada IP: 192.168.1.101</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
